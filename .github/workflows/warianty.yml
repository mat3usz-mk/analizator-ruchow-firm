name: Test wariantów parametrów

# Ręcznie: porównanie wariantów parametrów indeksu na teście historycznym.
on:
  workflow_dispatch:
    inputs:
      z_przebiegu:
        description: "numer przebiegu z bazą historia_gkg (artefakt)"
        default: "43880895708"
      warianty:
        description: "warianty oddzielone średnikiem, np. przedruk=1.0;przedruk=0.15"
        default: "przedruk=1.0;przedruk=0.15;przedruk=0.0"
      raport:
        description: "plik raportu"
        default: "raporty/przedruki-wyniki.md"
      pierwotne_z_przebiegu:
        description: "numer przebiegu z historią źródeł pierwotnych (puste = bez nich)"
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: historia_gkg
          path: .
          run-id: ${{ github.event.inputs.z_przebiegu }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: github.event.inputs.pierwotne_z_przebiegu != ''
        with:
          name: pierwotne_historia
          path: .
          run-id: ${{ github.event.inputs.pierwotne_z_przebiegu }}
          github-token: ${{ github.token }}
      - name: Test
        run: python -m analizator.warianty --db historia_gkg.db --pierwotne pierwotne_historia.db --warianty "${{ github.event.inputs.warianty }}" --out "${{ github.event.inputs.raport }}"
      - name: Zapis wyniku
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.raport }}"
          git commit -m "Test wariantów: wyniki" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done
