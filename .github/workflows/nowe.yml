name: Test nowych źródeł

# Ręcznie: zapasy ropy EIA, odsłony Wikipedii o tematach strachu, ton wiadomości GDELT (każde osobno) i test permutacyjny.
on:
  workflow_dispatch:
    inputs:
      z_przebiegu:
        description: "numer przebiegu z bazą historia_gkg (puste = z wydania „dane”)"
        default: ""
      pierwotne_z_przebiegu:
        description: "numer przebiegu z historią źródeł pierwotnych (puste = z wydania „dane”)"
        default: ""
      nowe_z_przebiegu:
        description: "numer wcześniejszego przebiegu tego zadania z pobraną historią nowych źródeł (pomija pobieranie)"
        default: ""
      zrodla:
        description: "źródła do pobrania"
        default: "eia,wiki,ton"

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        if: github.event.inputs.z_przebiegu != ''
        with:
          name: historia_gkg
          path: .
          run-id: ${{ github.event.inputs.z_przebiegu }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: github.event.inputs.pierwotne_z_przebiegu != ''
        with:
          name: pierwotne_historia
          path: .
          run-id: ${{ github.event.inputs.pierwotne_z_przebiegu }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: github.event.inputs.nowe_z_przebiegu != ''
        with:
          name: nowe_historia
          path: .
          run-id: ${{ github.event.inputs.nowe_z_przebiegu }}
          github-token: ${{ github.token }}
      - name: Dane z wydania „dane” (bez ponownego pobierania)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/dane.sh pobierz historia_gkg.db pierwotne_historia.db nowe_historia.db nowe_ton.db
      - name: Historia EIA i Wikipedii
        if: hashFiles('nowe_historia.db') == ''
        timeout-minutes: 90
        continue-on-error: true
        run: python -m analizator.nowe_zrodla --zrodla ${{ github.event.inputs.zrodla == 'eia' && 'eia' || 'eia,wiki' }} --od 2017-03-01 --db nowe_historia.db
      - name: Historia tonu GDELT
        if: hashFiles('nowe_ton.db') == '' && contains(github.event.inputs.zrodla, 'ton')
        timeout-minutes: 180
        continue-on-error: true
        run: python -m analizator.nowe_zrodla --zrodla ton --od 2017-03-01 --db nowe_ton.db
      - name: Zapis danych w wydaniu „dane”
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/dane.sh wyslij nowe_historia.db nowe_ton.db
      - name: Historia krótkiej sprzedaży (FINRA)
        if: github.event.inputs.zrodla != 'eia'
        continue-on-error: true
        run: python -m analizator.ryby --od 2021-09-01 --zrodla finra_short --db ryby_historia.db
      - name: Test
        if: github.event.inputs.zrodla != 'eia'
        run: python -m analizator.nowe_testy --db historia_gkg.db --pierwotne pierwotne_historia.db ryby_historia.db --nowe nowe_historia.db nowe_ton.db --out raporty/nowe-zrodla-wyniki.md
      - name: Test EIA
        if: github.event.inputs.zrodla == 'eia'
        run: python -m analizator.nowe_testy --db historia_gkg.db --nowe nowe_historia.db --tylko-eia --out raporty/nowe-zrodla-eia.md
      - name: Zapis wyniku
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add raporty/nowe-zrodla-*.md
          git commit -m "Test nowych źródeł: wyniki" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done
