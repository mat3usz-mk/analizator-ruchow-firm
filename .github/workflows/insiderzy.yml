name: Test insiderów

# Ręcznie: zbiory SEC Form 3/4/5 od 2018 r. i test, czy nietypowe transakcje insiderów spółek zbrojeniowych
# i energetycznych z USA wyprzedzały wydarzenia i ruchy kursów ich branży.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m analizator.insiderzy_test --od 2019 --out raporty/insiderzy-wyniki.md
      - name: Zapis wyniku
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add raporty/insiderzy-wyniki.md
          git commit -m "Test insiderów: wyniki" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done
