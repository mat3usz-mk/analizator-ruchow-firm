name: Test źródeł pierwotnych

# Ręcznie: pobiera historię źródeł pierwotnych (sankcje UE/UK, IODA, PortWatch, kursy walut) i porównuje na teście
# historycznym warianty: tylko artykuły / artykuły + źródła pierwotne / mniejsza waga artykułów.
on:
  workflow_dispatch:
    inputs:
      z_przebiegu:
        description: "numer przebiegu z bazą historia_gkg (puste = z wydania „dane”)"
        default: ""
      pierwotne_z_przebiegu:
        description: "numer przebiegu z gotową historią źródeł pierwotnych (pomija pobieranie)"
        default: ""
      zrodla:
        description: "warianty źródeł pierwotnych oddzielone średnikiem, np. sankcje_ue,sankcje_uk,kursy;ioda"
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        if: github.event.inputs.z_przebiegu != ''
        with:
          name: historia_gkg
          path: .
          run-id: ${{ github.event.inputs.z_przebiegu }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: github.event.inputs.pierwotne_z_przebiegu != ''
        with:
          name: pierwotne_historia
          path: .
          run-id: ${{ github.event.inputs.pierwotne_z_przebiegu }}
          github-token: ${{ github.token }}
      - name: Dane z wydania „dane” (bez ponownego pobierania)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/dane.sh pobierz historia_gkg.db pierwotne_historia.db
      - name: Historia źródeł pierwotnych
        if: hashFiles('pierwotne_historia.db') == ''
        run: python -m analizator.oficjalne --od 2018-09-01 --db pierwotne_historia.db
      - name: Zapis danych w wydaniu „dane”
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/dane.sh wyslij pierwotne_historia.db
      # Źródła z kontem (ACLED, AGSI): dane tylko w tym zadaniu, bez artefaktu (warunki ACLED zabraniają publikacji danych)
      - name: Historia źródeł z kontem
        env:
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          AGSI_KEY: ${{ secrets.AGSI_KEY }}
        run: python -m analizator.oficjalne --od 2021-09-01 --zrodla acled,agsi --db pierwotne_klucze.db
      - name: Historia śladów dobrze poinformowanych (krótka sprzedaż FINRA, sprzedaż broni DSCA)
        run: python -m analizator.ryby --od 2021-09-01 --db ryby_historia.db
      - name: Porównanie wariantów
        run: |
          if [ -z "${{ github.event.inputs.zrodla }}" ]; then
            python -m analizator.porownanie --db historia_gkg.db --pierwotne pierwotne_historia.db pierwotne_klucze.db ryby_historia.db --out raporty/pierwotne-porownanie.md
          else
            echo "${{ github.event.inputs.zrodla }}" | tr ';' '\n' | while read -r z; do
              python -m analizator.porownanie --db historia_gkg.db --pierwotne pierwotne_historia.db pierwotne_klucze.db ryby_historia.db --zrodla "$z" --out "raporty/pierwotne-$(echo $z | tr ',' '-').md"
            done
          fi
      - name: Zapisz wynik w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/por && cp raporty/pierwotne-*.md /tmp/por/
          for i in 1 2 3; do
            git fetch -q origin main && git checkout -q -B main origin/main
            cp /tmp/por/*.md raporty/
            git add raporty/pierwotne-*.md
            git commit -q -m "Test historyczny: źródła pierwotne kontra artykuły" || exit 0
            git push -q origin main && break
            sleep 5
          done
