name: Czuwanie analizatora

# Co 30 minut: pobierz najnowsze wiadomości i ostrzeżenia, policz indeksy, powiadom tylko o istotnych zmianach.
# GitHub uruchamia harmonogram z opóźnieniem do kilkunastu minut, gdy ma duże obciążenie.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mail_teraz:
        description: "wyślij teraz raport e-mailem (test wysyłki)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: czuwanie
  cancel-in-progress: false

jobs:
  cykl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    env:
      CICHO: "1"  # repozytorium jest publiczne: treść alarmów nie trafia do logów
      PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Baza i stan czuwania przechodzą z uruchomienia na uruchomienie przez pamięć podręczną GitHuba.
      - name: Odtwórz bazę z poprzedniego cyklu
        uses: actions/cache/restore@v4
        with:
          path: dane
          key: dane-${{ github.run_id }}
          restore-keys: dane-

      - name: Baza startowa (pierwsze uruchomienie)
        run: |
          mkdir -p dane
          [ -f dane/analizator.db ] || cp dane_start/analizator.db dane/analizator.db

      - name: Cykl analizatora
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          AGSI_KEY: ${{ secrets.AGSI_KEY }}
        run: |
          pip install -q pypdf  # odczyt zgłoszeń transakcji kongresmenów (PDF)
          python -m analizator watch --once --db dane/analizator.db \
            --out dane/raport_biezacy.html --alerts-out dane/nowe_alerty.txt

      # Strona z raportem pod stałym adresem, zaszyfrowana hasłem (sekret PAGE_PASSWORD). Bez hasła nic nie jest publikowane.
      - name: Strona z raportem (zaszyfrowana)
        id: strona
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          pip install -q cryptography
          if python -m analizator.strona --dane dane --out strona; then echo "ok=1" >> "$GITHUB_OUTPUT"; fi

      - name: Przygotuj stronę do publikacji
        if: steps.strona.outputs.ok == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: strona

      - name: Opublikuj stronę (GitHub Pages)
        if: steps.strona.outputs.ok == '1'
        continue-on-error: true  # działa po włączeniu Pages w ustawieniach (Source: GitHub Actions)
        uses: actions/deploy-pages@v4

      # Zgłoszenia są publiczne, więc domyślnie wyłączone. Włącza je zmienna repozytorium ALARMY_ISSUES = tak.
      - name: Zgłoszenie na GitHubie przy alarmie
        if: hashFiles('dane/nowe_alerty.txt') != '' && vars.ALARMY_ISSUES == 'tak'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s dane/nowe_alerty.txt ]; then
            head -c 60000 dane/nowe_alerty.txt > body.txt
            printf '\n\nRaport: %s/%s/actions/runs/%s\nTo wskazówka, nie prawdopodobieństwo ani rekomendacja inwestycyjna.\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> body.txt
            gh issue create --title "Alarm analizatora $(date -u +'%Y-%m-%d %H:%M') UTC: $(head -n1 dane/nowe_alerty.txt | cut -c1-120)" --body-file body.txt
          fi

      - name: E-mail z alarmem
        if: hashFiles('dane/nowe_alerty.txt') != ''
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
        run: |
          if [ -s dane/nowe_alerty.txt ]; then
            cp dane/nowe_alerty.txt mail.txt
            if [ "${{ steps.strona.outputs.ok }}" = "1" ]; then att=""; printf '\n\nPełny raport (hasło jak zwykle): %s\n' "$PAGE_URL" >> mail.txt
            else att="--attach dane/raport_biezacy.html"; fi
            python -m analizator.poczta --subject "Alarm analizatora: $(head -n1 dane/nowe_alerty.txt | cut -d: -f1 | cut -c1-100)" \
              --body-file mail.txt $att || true
          fi

      # Raz dziennie, w pierwszym cyklu po 2:00 UTC (3:00 w Polsce zimą, 4:00 latem): podsumowanie i pełny raport.
      - name: Codzienny raport e-mailem
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          TERAZ: ${{ github.event.inputs.mail_teraz }}
        run: |
          today=$(date -u +%F)
          if [ "$TERAZ" = "true" ] || { [ "$(date -u +%H)" -ge 2 ] && [ "$(cat dane/ostatni_mail_dzienny.txt 2>/dev/null)" != "$today" ]; }; then
            cp dane/podsumowanie.txt mail.txt
            if [ "${{ steps.strona.outputs.ok }}" = "1" ]; then att=""; printf '\nRaport online (hasło jak zwykle): %s\n' "$PAGE_URL" >> mail.txt
            else att="--attach dane/raport_biezacy.html"; fi
            if python -m analizator.poczta --subject "Analizator ruchów firm: raport $today" --body-file mail.txt $att; then
              echo "$today" > dane/ostatni_mail_dzienny.txt
            fi
          fi

      - name: Zapisz bazę na następny cykl
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dane
          key: dane-${{ github.run_id }}
