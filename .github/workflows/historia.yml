name: Historia i uczenie modelu

# Ręcznie (zakładka Actions -> "Historia i uczenie modelu" -> Run workflow).
# 1) Dla każdego roku osobno (równolegle) pobiera pliki GDELT GKG (próbka: jeden plik na godzinę)
#    i zapisuje tylko nagłówki, w których klasyfikator widzi sygnał.
# 2) Łączy lata w jedną bazę, uczy model na 2015-2024 i sprawdza go na 2025-2026.
# 3) Zapisuje do repozytorium analizator/model.json i raporty/model-wyniki.md (raport porównuje model z ręcznym indeksem).
on:
  workflow_dispatch:
    inputs:
      stride:
        description: "co który plik GDELT brać (4 = jeden na godzinę)"
        default: "4"
      z_przebiegu:
        description: "numer wcześniejszego przebiegu: tylko uczenie na już pobranych latach (bez pobierania)"
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  rok:
    if: github.event.inputs.z_przebiegu == ''
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        rok: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pobierz rok ${{ matrix.rok }}
        run: |
          start="${{ matrix.rok }}-01-01"; [ "${{ matrix.rok }}" = "2015" ] && start="2015-02-18"
          end="${{ matrix.rok }}-12-31"
          # dwa przebiegi: drugi dobiera pliki, które za pierwszym razem dały błąd
          for i in 1 2; do
            python -m analizator.gdelt_pliki --from "$start" --to "$end" --db "h_${{ matrix.rok }}.db" \
              --stride ${{ github.event.inputs.stride || 4 }} --workers 10 | (grep -v "^  błąd" || true) | tail -n 40
          done
      - uses: actions/upload-artifact@v4
        with:
          name: h_${{ matrix.rok }}
          path: h_${{ matrix.rok }}.db
          retention-days: 30

  ucz:
    needs: rok
    if: always() && (needs.rok.result == 'success' || github.event.inputs.z_przebiegu != '')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: lata
          pattern: h_*
          merge-multiple: true
          run-id: ${{ github.event.inputs.z_przebiegu || github.run_id }}
          github-token: ${{ github.token }}
      - name: Połącz lata w jedną bazę
        run: |
          python - <<'EOF'
          import glob, sqlite3
          from analizator import store
          con = store.connect("historia_gkg.db")
          for f in sorted(glob.glob("lata/*.db")):
              con.execute("ATTACH ? AS s", (f,))
              con.execute("INSERT OR IGNORE INTO articles(url,title,date,source,domain,lang) SELECT url,title,date,source,domain,lang FROM s.articles")
              con.commit(); con.execute("DETACH s")
              print(f, con.execute("SELECT COUNT(*) FROM articles").fetchone()[0])
          for y, n in con.execute("SELECT substr(date,1,4), COUNT(*) FROM articles GROUP BY 1"):
              print(y, n)
          EOF
      - name: Uczenie i test
        run: |
          # pliki GKG mają tytuły stron dopiero od 2019 r., więc uczenie realnie obejmuje 2019-2024
          python -m analizator.ucz --db historia_gkg.db --train-events wydarzenia_2015_2024.csv --test-events wydarzenia.csv \
            --train-from 2019-03-01 --train-to 2024-12-31 --test-from 2025-03-01 --out-report raporty/model-wyniki.md --out-episodes raporty/epizody.json
      - name: Indeksy giełdowe po dawnych alarmach
        continue-on-error: true
        run: python -m analizator.rynki --epizody raporty/epizody.json --out analizator/rynki.json --raport raporty/rynki-wyniki.md
      - name: Zapisz model w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # zapis na najnowszym main (w międzyczasie mogły wejść inne zmiany), bez konfliktów
          mkdir -p /tmp/wynik && cp analizator/model.json raporty/model-wyniki.md raporty/epizody.json /tmp/wynik/ && cp analizator/rynki.json raporty/rynki-wyniki.md /tmp/wynik/ || true
          for i in 1 2 3; do
            git fetch -q origin main && git checkout -q -B main origin/main
            cp /tmp/wynik/model.json analizator/model.json && mkdir -p raporty && cp /tmp/wynik/model-wyniki.md /tmp/wynik/epizody.json raporty/
            [ -f /tmp/wynik/rynki.json ] && cp /tmp/wynik/rynki.json analizator/ && cp /tmp/wynik/rynki-wyniki.md raporty/
            git add analizator/model.json raporty/model-wyniki.md raporty/epizody.json; git add analizator/rynki.json raporty/rynki-wyniki.md 2>/dev/null || true
            git commit -q -m "Model uczony na historii, reguła łączona i sprawdzenie indeksów giełdowych" || exit 0
            git push -q origin main && break
            sleep 5
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historia_gkg
          path: historia_gkg.db
          retention-days: 30
      - name: Zapis danych w wydaniu „dane”
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/dane.sh wyslij historia_gkg.db
