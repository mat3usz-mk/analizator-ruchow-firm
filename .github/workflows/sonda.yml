name: Sonda źródeł

# Ręcznie: sprawdza, które publiczne źródła danych odpowiadają z serwerów GitHuba (kod HTTP i rozmiar odpowiedzi).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Archiwa Reddita i X (kod, rozmiar, początek odpowiedzi)
        run: |
          while read -r name url; do
            [ -z "$name" ] && continue
            r=$(curl -s -L -m 60 -A "analizator-ruchow-firm/0.10 (github.com/mat3usz-mk/analizator-ruchow-firm)" -r 0-4000 -o /tmp/b -w '%{http_code} %{size_download}' "$url")
            echo "$name $r $(head -c 1500 /tmp/b | tr -d '\n\r' | tr -c '[:print:]' ' ')"
          done <<LIST
          sc_list https://data.source.coop/dataforcanada/d4c-datapkg-web-corpus?list-type=2&prefix=archive/reddit/subreddits25/&max-keys=15
          sc_list2 https://data.source.coop/dataforcanada/d4c-datapkg-web-corpus/?list-type=2&prefix=archive/reddit/subreddits25/worldnews&max-keys=15
          sc_head https://data.source.coop/dataforcanada/d4c-datapkg-web-corpus/archive/reddit/subreddits25/worldnews_submissions.zst
          at_search https://academictorrents.com/browse.php?search=reddit+subreddits+2024
          LIST
      - name: Źródła „grubych ryb” (kod, rozmiar, początek odpowiedzi)
        if: false
        run: |
          while read -r name url; do
            [ -z "$name" ] && continue
            r=$(curl -s -L -m 60 -A "Mozilla/5.0 (analizator ruchow firm; kontakt w repozytorium)" -r 0-4000 -o /tmp/b -w '%{http_code} %{size_download}' "$url")
            echo "$name $r $(head -c 220 /tmp/b | tr -d '\n\r' | tr -c '[:print:]' ' ')"
          done <<LIST
          trumpstruth https://trumpstruth.org/
          trumpstruth_feed https://trumpstruth.org/feed
          trumparchive https://www.thetrumparchive.com/
          truth_api https://truthsocial.com/api/v1/accounts/107780257626128497/statuses?limit=2
          ttarchive_gh https://raw.githubusercontent.com/MarkHershey/CompleteTrumpTweetsArchive/master/data/realDonaldTrump_in_office.csv
          whitehouse_rss https://www.whitehouse.gov/feed/
          kremlin_rss http://en.kremlin.ru/events/president/news/rss
          xinhua_rss http://www.xinhuanet.com/english/rss/worldrss.xml
          bluesky https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=whitehouse.gov&limit=2
          LIST
      - name: Próbki formatów
        if: false
        run: |
          now=$(date -u +%s); y=$((now-400*86400))
          echo "== IODA"; curl -s -m 60 "https://api.ioda.inetintel.cc.gatech.edu/v2/outages/events?from=$y&until=$now&entityType=country&limit=3" | head -c 1500; echo
          echo "== IODA 2019"; curl -s -m 60 "https://api.ioda.inetintel.cc.gatech.edu/v2/outages/events?from=1546300800&until=1549000000&entityType=country&limit=2" | head -c 600; echo
          echo "== PORTWATCH"; curl -s -m 60 "https://services9.arcgis.com/weJ1QsnbMYJlCHdG/arcgis/rest/services/Daily_Chokepoints_Data/FeatureServer/0/query?where=1%3D1&outFields=*&resultRecordCount=2&f=json" | head -c 1500; echo
          echo "== UK"; curl -s -m 120 https://sanctionslist.fcdo.gov.uk/docs/UK-Sanctions-List.csv | head -n 4 | cut -c1-1500
          echo "== EU"; curl -s -m 120 "https://webgate.ec.europa.eu/fsd/fsf/public/files/xmlFullSanctionsList_1_1/content?token=dG9rZW4tMjAxNw" | head -c 4000; echo
          echo "== UN"; curl -s -m 120 https://scsanctions.un.org/resources/xml/en/consolidated.xml | head -c 2500; echo
          echo "== RADA"; curl -s -m 60 https://www.consilium.europa.eu/en/rss/pressreleases.ashx | grep -o "<title>[^<]*" | head -8
          echo "== ONZ"; curl -s -m 60 https://press.un.org/en/rss.xml | grep -o "<title>[^<]*" | head -8
          echo "== UKMTO"; curl -s -m 60 https://www.ukmto.org/recent-incidents | grep -o '__NEXT_DATA__[^<]\{0,1500\}' | head -c 1500; echo

      # Archiwum Truth Social (trumpstruth.org) – zgoda osoby z 16.11.2026
      - name: Budowa wpisu Truth Social
        continue-on-error: true
        run: |
          c=$(printf '{"status_created_at":"2023-06-01 00:00:00","_pointsToNextItems":true}' | base64 -w0)
          curl -s -L -m 60 -A "Mozilla/5.0" "https://trumpstruth.org/?sort=desc&per_page=100&cursor=$c" -o /tmp/p.html
          echo "bajtów $(wc -c < /tmp/p.html), wpisów $(grep -o '<div class="status"' /tmp/p.html | wc -l)"
          python3 - <<'PY'
          s = open("/tmp/p.html", encoding="utf-8", errors="replace").read()
          i = s.find('<div class="status"')
          print(s[i:i + 3500])
          j = s.rfind('<div class="status"')
          import re
          print("OSTATNI:", re.sub(r"\s+", " ", s[j:j + 1500]))
          PY
